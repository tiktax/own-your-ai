[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownyourai"
version = "0.3.1"
description = "Your AI. Your data. Your rules. — Individual AI & Data Sovereignty."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "tiktax" }]
keywords = ["ai", "sovereignty", "privacy", "mydata", "ssi", "did", "offline-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "base58>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
oya = "ownyourai.cli:main"

[project.urls]
Homepage = "https://github.com/tiktax/own-your-ai"
Repository = "https://github.com/tiktax/own-your-ai"
Issues = "https://github.com/tiktax/own-your-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ownyourai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert usage in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/ownyourai/llm/*" = ["S310"]  # intentional HTTP to localhost ollama
"src/ownyourai/audit/*" = ["S310"]  # intentional HTTP to TSA for RFC 3161

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=ownyourai --cov-report=term-missing"
